name: Deploy crema.s3 to Hostinger KVM1

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-s3
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          # Hostinger's firewall intermittently drops SYNs from GitHub runner
          # IPs (verified on the S1 repo). appleboy's `allenvs`/retry aren't
          # first-class here, so give the SSH handshake a generous connect
          # timeout and keepalive so a slow path through the firewall still
          # completes; the action itself fails fast on auth rejection.
          timeout: 60s
          command_timeout: 20m
          allenvs: false
          script: |
            set -euo pipefail
            cd ~/domains/s3.crema.supply/public_html/core3
            bash deploy.sh